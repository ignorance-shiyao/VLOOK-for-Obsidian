name: release
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/plugin/main.js
            dist/plugin/styles.css
            dist/plugin/manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/plugin/main.js dist/plugin/styles.css dist/plugin/manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/plugin/main.js dist/plugin/styles.css dist/plugin/manifest.json --title "$GITHUB_REF_NAME" --notes "插件名改为 Vlook；发布流程加入构建证明。"
          fi
